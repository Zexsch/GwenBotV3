[project]
name = "gwenbotv3"
version = "3.3.0"
description = "GwenBotV3"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = ["discord", "league of legends", "gwen", "bot"]
authors = [{ name = "Zexsch"}]
dependencies = [
    "aiomysql>=0.3.2",
    "beautifulsoup4>=4.15.0",
    "discord-py>=2.7.1",
    "openai>=2.48.0",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.0.51",
]

[project.urls]
Repository = "https://github.com/Zexsch/GwenBotV3"
Issues = "https://github.com/Zexsch/GwenBotV3/issues"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project.scripts]
gwenbot-init = "gwenbotv3.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gwenbotv3"]

[dependency-groups]
dev = [
    "alembic>=1.18.5",
    "bandit>=1.9.4",
    "deptry>=0.25.1",
    "dotenv>=0.9.9",
    "hatch>=1.17.1",
    "mypy>=2.3.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.1",
    "pylint>=4.0.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "ruff>=0.16.0",
    "vulture>=2.16",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["bs4.*"] # bs4 kinda shit with typing so
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --cov=gwenbotv3 --cov-report=term-missing"

[tool.coverage.run]
source = ["gwenbotv3"]
omit = ["*/main.py"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.vulture]
paths = ["src/gwenbotv3"]
min_confidence = 80

[tool.uv]
package = true

[tool.uv.workspace]
members = ["."]

[tool.deptry.per_rule_ignores]
DEP003 = ["gwenbotv3"]